<div class="offcanvas offcanvas-end" tabindex="-1" id="layoutSettingsPanel">
  <div class="offcanvas-header">
    <h3 class="offcanvas-title">Theme Settings</h3>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <div class="mb-4">
      <label class="form-label">Color mode</label>
      <label class="form-check">
        <input type="radio" name="theme" value="light" class="form-check-input"
          [checked]="layout.theme() === 'light'"
          (change)="update('theme', 'light')">
        <span class="form-check-label">Light</span>
      </label>
      <label class="form-check">
        <input type="radio" name="theme" value="dark" class="form-check-input"
          [checked]="layout.theme() === 'dark'"
          (change)="update('theme', 'dark')">
        <span class="form-check-label">Dark</span>
      </label>
    </div>

    <div class="mb-4">
      <label class="form-label">Color scheme</label>
      <div class="row g-2">
        <div class="col-auto" *ngFor="let t of themes">
          <label class="form-colorinput">
            <input type="radio" name="theme-primary" [value]="t.key" class="form-colorinput-input"
              [checked]="layout.themePrimary() === t.key"
              (change)="update('theme-primary', t.key)">
            <span class="form-colorinput-color" [class]="t.class"></span>
          </label>
        </div>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Font family</label>
      <div *ngFor="let f of fonts">
        <label class="form-check">
          <input type="radio" name="theme-font" [value]="f" class="form-check-input"
            [checked]="layout.themeFont() === f"
            (change)="update('theme-font', f)">
          <span class="form-check-label">{{ f }}</span>
        </label>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Theme base</label>
      <div *ngFor="let b of bases">
        <label class="form-check">
          <input type="radio" name="theme-base" [value]="b" class="form-check-input"
            [checked]="layout.themeBase() === b"
            (change)="update('theme-base', b)">
          <span class="form-check-label">{{ b }}</span>
        </label>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Corner Radius</label>
      <div *ngFor="let r of radii">
        <label class="form-check">
          <input type="radio" name="theme-radius" [value]="r" class="form-check-input"
            [checked]="layout.themeRadius() === r"
            (change)="update('theme-radius', r)">
          <span class="form-check-label">{{ r }}</span>
        </label>
      </div>
    </div>

    <div class="mt-4">
      <button type="button" class="btn btn-outline-danger w-100" (click)="reset()">Reset</button>
    </div>
  </div>
</div>
