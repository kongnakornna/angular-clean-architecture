<div class="row g-3">
  <div class="col-md-3" *ngFor="let stat of stats">
    <div class="card">
      <div class="card-body">
        <div class="subheader">{{ stat.label }}</div>
        <div class="h1 mb-0">{{ stat.value }}</div>
        <div class="d-flex align-items-baseline">
          <span class="text-green me-1">{{ stat.change }}</span>
          <span class="text-secondary">{{ 'analytics.comparedToLastMonth' | translate }}</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row g-3 mt-3">
  <div class="col-md-8">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ 'analytics.monthlySales' | translate }}</h3>
      </div>
      <div class="card-body">
        <div id="chart-monthly-sales" style="height: 250px; background: var(--tblr-bg-surface-secondary); border-radius: 4px; display: flex; align-items: center; justify-content: center">
          <span class="text-secondary">{{ 'analytics.monthlySalesChart' | translate }}</span>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">{{ 'analytics.workDistribution' | translate }}</h3>
      </div>
      <div class="card-body">
        <div id="chart-distribution" style="height: 250px; background: var(--tblr-bg-surface-secondary); border-radius: 4px; display: flex; align-items: center; justify-content: center">
          <span class="text-secondary">{{ 'analytics.pieChart' | translate }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
