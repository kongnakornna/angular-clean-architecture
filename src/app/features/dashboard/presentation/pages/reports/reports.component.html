<div class="card">
  <div class="card-header">
    <h3 class="card-title">{{ 'reports.recent' | translate }}</h3>
  </div>
  <div class="table-responsive">
    <table class="table table-vcenter card-table">
      <thead>
        <tr>
          <th>{{ 'reports.name' | translate }}</th>
          <th>{{ 'reports.type' | translate }}</th>
          <th>{{ 'reports.createdAt' | translate }}</th>
          <th>{{ 'reports.status' | translate }}</th>
          <th class="w-1"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of reports">
          <td>{{ r.name }}</td>
          <td>{{ r.type }}</td>
          <td>{{ r.createdAt }}</td>
          <td>
            <span class="badge" [class.bg-green]="r.status === 'พร้อม'" [class.bg-yellow]="r.status === 'กำลังสร้าง'">{{ r.status }}</span>
          </td>
          <td>
            <button class="btn btn-sm btn-primary"
                    [disabled]="downloading || r.status !== 'พร้อม'"
                    (click)="download(r.reportType)">
              {{ 'reports.download' | translate }}
            </button>
          </td>
        </tr>
        <tr *ngIf="reports.length === 0">
          <td colspan="5" class="text-center text-secondary py-4">{{ 'reports.noReports' | translate }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
