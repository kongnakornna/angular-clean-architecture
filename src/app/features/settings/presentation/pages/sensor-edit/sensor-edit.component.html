<div class="page-header d-print-none">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">{{ 'sensor.editTitle' | translate }}</h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
      <a routerLink="/settings/sensor" class="btn btn-outline-secondary">{{ 'sensor.back' | translate }}</a>
    </div>
  </div>
</div>
<br>
<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'sensor.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'sensor.type' | translate }}</label>
          <input type="text" class="form-control" name="type" [(ngModel)]="type">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'sensor.unit' | translate }}</label>
          <input type="text" class="form-control" name="unit" [(ngModel)]="unit">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">{{ 'sensor.minThreshold' | translate }}</label>
          <input type="number" class="form-control" name="minThreshold" [(ngModel)]="minThreshold">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ 'sensor.maxThreshold' | translate }}</label>
          <input type="number" class="form-control" name="maxThreshold" [(ngModel)]="maxThreshold">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'sensor.status' | translate }}</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="status" [(ngModel)]="status" id="status">
          <label class="form-check-label" for="status">{{ status ? ('sensor.active' | translate) : ('sensor.inactive' | translate) }}</label>
        </div>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary">{{ 'sensor.update' | translate }}</button>
      </div>
    </form>
  </div>
</div>
