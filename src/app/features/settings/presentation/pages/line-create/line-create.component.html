<div class="page-header d-print-none">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">{{ 'line.createTitle' | translate }}</h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
      <a routerLink="/settings/line" class="btn btn-outline-secondary">{{ 'line.back' | translate }}</a>
    </div>
  </div>
</div>
<br>
<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'line.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'line.channelAccessToken' | translate }}</label>
        <input type="text" class="form-control" name="channelAccessToken" [(ngModel)]="channelAccessToken" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'line.userId' | translate }}</label>
        <input type="text" class="form-control" name="userId" [(ngModel)]="userId" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'line.status' | translate }}</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="status" [(ngModel)]="status" id="status">
          <label class="form-check-label" for="status">{{ status ? ('line.active' | translate) : ('line.inactive' | translate) }}</label>
        </div>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary">{{ 'line.save' | translate }}</button>
      </div>
    </form>
  </div>
</div>
