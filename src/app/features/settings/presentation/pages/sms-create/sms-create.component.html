<div class="page-header d-print-none">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">{{ 'sms.createTitle' | translate }}</h2>
    </div>
    <div class="col-auto ms-auto d-print-none">
      <a routerLink="/settings/sms" class="btn btn-outline-secondary">{{ 'sms.back' | translate }}</a>
    </div>
  </div>
</div>
<br>
<div class="card">
  <div class="card-body">
    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">{{ 'sms.name' | translate }}</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'sms.gatewayUrl' | translate }}</label>
        <input type="url" class="form-control" name="gatewayUrl" [(ngModel)]="gatewayUrl" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'sms.apiKey' | translate }}</label>
        <input type="text" class="form-control" name="apiKey" [(ngModel)]="apiKey" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'sms.phone' | translate }}</label>
        <input type="tel" class="form-control" name="phone" [(ngModel)]="phone" required>
      </div>
      <div class="mb-3">
        <label class="form-label">{{ 'sms.status' | translate }}</label>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" name="status" [(ngModel)]="status" id="status">
          <label class="form-check-label" for="status">{{ status ? ('sms.active' | translate) : ('sms.inactive' | translate) }}</label>
        </div>
      </div>
      <div class="form-footer">
        <button type="submit" class="btn btn-primary">{{ 'sms.save' | translate }}</button>
      </div>
    </form>
  </div>
</div>
