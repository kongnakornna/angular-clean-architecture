<div class="page-header d-print-none">
  <div class="row align-items-center">
    <div class="col">
      <h2 class="page-title">{{ 'settings.title' | translate }}</h2>
      <div class="text-secondary mt-1">{{ 'settings.menu' | translate }}</div>
    </div>
  </div>
</div>
<br>
<div class="row row-cards">
  <div class="col-md-3">
    <div class="card">
      <div class="card-body">
        <ng-container *ngFor="let group of menuGroups">
          <div class="settings-menu-group">
            <div class="settings-menu-group-label">{{ group.labelKey | translate }}</div>
            <a *ngFor="let item of group.items"
               [routerLink]="item.route"
               routerLinkActive="active"
               class="list-group-item list-group-item-action d-flex align-items-center">
              <i-tabler [name]="item.icon" class="me-2 icon-tabler"></i-tabler>
              {{ item.labelKey | translate }}
            </a>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="col-md-9">
    <router-outlet></router-outlet>
  </div>
</div>
