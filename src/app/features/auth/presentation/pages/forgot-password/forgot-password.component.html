<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="." class="navbar-brand navbar-brand-autodark">
        <i-tabler name="layout-dashboard" class="navbar-brand-image"></i-tabler>
        iCmon
      </a>
    </div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">ลืมรหัสผ่าน</h2>
        <p class="text-secondary mb-4">กรุณากรอกอีเมลของคุณ ระบบจะส่งลิงก์รีเซ็ตรหัสผ่านให้คุณ</p>
        <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
        <div *ngIf="success" class="alert alert-success mb-3">
          ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลของคุณแล้ว
        </div>
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" autocomplete="off" novalidate>
          <div class="mb-3">
            <input type="email" class="form-control" [(ngModel)]="email" name="email" required placeholder="your@email.com">
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" [disabled]="forgotForm.invalid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              ส่งลิงก์รีเซ็ตรหัสผ่าน
            </button>
          </div>
        </form>
      </div>
    </div>
    <div class="text-center text-secondary mt-3">
      <a routerLink="/login">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
</div>
