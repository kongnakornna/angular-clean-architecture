<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <a href="." class="navbar-brand navbar-brand-autodark">
        <i-tabler name="layout-dashboard" class="navbar-brand-image"></i-tabler>
        iCmon
      </a>
    </div>
    <form class="card card-md" (ngSubmit)="onSubmit()" #signUpForm="ngForm" autocomplete="off" novalidate>
      <div class="card-body">
        <h2 class="card-title text-center mb-4">สมัครสมาชิก</h2>
        <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
        <div class="mb-3">
          <label class="form-label">ชื่อ-นามสกุล</label>
          <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="ชื่อผู้ใช้" required>
        </div>
        <div class="mb-3">
          <label class="form-label">อีเมล</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">รหัสผ่าน</label>
          <div class="input-group input-group-flat">
            <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="รหัสผ่าน" required autocomplete="new-password">
            <span class="input-group-text">
              <a href="javascript:void(0)" class="link-secondary" title="แสดงรหัสผ่าน" (click)="togglePassword()">
                <i-tabler [name]="passwordVisible ? 'eye-off' : 'eye'" class="icon"></i-tabler>
              </a>
            </span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">ยืนยันรหัสผ่าน</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="ยืนยันรหัสผ่าน" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" [(ngModel)]="agreeTerms" name="agreeTerms">
            <span class="form-check-label">ยอมรับ<a href="javascript:void(0)">ข้อกำหนดและเงื่อนไข</a></span>
          </label>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" [disabled]="signUpForm.invalid || !agreeTerms || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            สมัครสมาชิก
          </button>
        </div>
      </div>
    </form>
    <div class="text-center text-secondary mt-3">
      มีบัญชีแล้ว? <a routerLink="/login">เข้าสู่ระบบ</a>
    </div>
  </div>
</div>
