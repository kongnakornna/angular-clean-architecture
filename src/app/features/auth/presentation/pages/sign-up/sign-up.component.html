<div class="page page-center">
  <div class="container container-tight py-4">
    <form class="card card-md" (ngSubmit)="onSubmit()" #signUpForm="ngForm" autocomplete="off" novalidate>
      <div class="card-body">
        <h2 class="card-title text-center mb-4">{{ 'auth.signUp.title' | translate }}</h2>
        <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
        <div class="mb-3">
          <label class="form-label">{{ 'auth.signUp.nameLabel' | translate }}</label>
          <input type="text" class="form-control" [(ngModel)]="name" name="name" placeholder="{{ 'auth.signUp.namePlaceholder' | translate }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ 'auth.signUp.emailLabel' | translate }}</label>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="your@email.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ 'auth.signUp.passwordLabel' | translate }}</label>
          <div class="input-group input-group-flat">
            <input [type]="passwordVisible ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="{{ 'auth.signUp.passwordPlaceholder' | translate }}" required autocomplete="new-password">
            <span class="input-group-text">
              <a href="javascript:void(0)" class="link-secondary" [title]="'common.password' | translate" (click)="togglePassword()">
                <i-tabler [name]="passwordVisible ? 'eye-off' : 'eye'" class="icon"></i-tabler>
              </a>
            </span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ 'auth.signUp.confirmPasswordLabel' | translate }}</label>
          <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="{{ 'auth.signUp.confirmPasswordPlaceholder' | translate }}" required autocomplete="new-password">
        </div>
        <div class="mb-3">
          <label class="form-check">
            <input type="checkbox" class="form-check-input" [(ngModel)]="agreeTerms" name="agreeTerms">
            <span class="form-check-label">{{ 'auth.signUp.agreeTerms' | translate }}<a href="javascript:void(0)">{{ 'auth.signUp.termsLink' | translate }}</a></span>
          </label>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" [disabled]="signUpForm.invalid || !agreeTerms || loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            {{ 'auth.signUp.submit' | translate }}
          </button>
        </div>
      </div>
    </form>
    <div class="text-center text-secondary mt-3">
      {{ 'auth.signUp.hasAccount' | translate }} <a routerLink="/login">{{ 'auth.signUp.loginLink' | translate }}</a>
    </div>
  </div>
</div>
