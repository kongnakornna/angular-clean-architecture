<div class="page page-center">
  <div class="container-tight py-4">
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">เข้าสู่ระบบ</h2>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="mb-3">
            <label class="form-label">ชื่อผู้ใช้</label>
            <input type="text" class="form-control" [(ngModel)]="email" name="email" required placeholder="demo" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label">รหัสผ่าน</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" required placeholder="รหัสผ่าน" autocomplete="current-password">
          </div>
          <div class="form-footer">
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              เข้าสู่ระบบ
            </button>
          </div>
        </form>
        <div class="text-center text-muted mt-3">
          <a routerLink="/forgot-password">ลืมรหัสผ่าน?</a>
        </div>
        <div class="text-center mt-3 p-2 bg-light rounded border">
          <small class="text-muted">
            <strong>Demo:</strong> ใช้ <code>demo</code> / <code>demo</code> เพื่อทดสอบระบบ
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
