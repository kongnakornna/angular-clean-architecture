<div class="page page-center">
  <div class="container container-tight py-4">
    <form class="card card-md" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
      <div class="card-body">
        <h2 class="card-title text-center mb-4">2-Step Verification</h2>
        <div class="mb-3">
          <label class="form-label">ประเทศ</label>
          <select class="form-select" [(ngModel)]="countryCode" name="countryCode">
            <option *ngFor="let c of countries" [value]="c.dial">{{ c.name }}</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <div class="input-group">
            <span class="input-group-text">{{ countryCode }}</span>
            <input type="text" class="form-control" [(ngModel)]="phoneNumber" name="phoneNumber" placeholder="กรอกเบอร์โทรศัพท์">
          </div>
        </div>
        <div class="text-secondary mb-3">
          เพื่อความปลอดภัยของบัญชีของคุณ เราจะส่งรหัสยืนยันทาง SMS เมื่อคุณเข้าสู่ระบบจากอุปกรณ์ใหม่
        </div>
        <div class="form-footer">
          <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
            ส่งรหัส
          </button>
        </div>
      </div>
    </form>
    <div class="text-center text-secondary mt-3">
      <a routerLink="/login">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
</div>
