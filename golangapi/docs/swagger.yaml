  responses.SuccessResponse-presenter_ItemResponse:
    properties:
      data:
        $ref: '#/definitions/presenter.ItemResponse'
      is_success:
        example: true
        type: boolean
    type: object
  responses.SuccessResponse-presenter_PaginatedItemsResponse:
    properties:
      data:
        $ref: '#/definitions/presenter.PaginatedItemsResponse'
      is_success:
        example: true
        type: boolean
    type: object
  responses.SwaggerSuccessResponse:
    properties:
      data: {}
      is_success:
        type: boolean
    type: object
info:
  contact: {}
  description: API for ICMON project
  title: Go IoT API
  version: "1.0"
paths:
  /alarm/validate:
    post:
      consumes:
      - application/json
      description: Calculates alarm level, title, subject, content and control messages
        based on sensor data and thresholds. Uses Thai language messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: invalid JSON body
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_alarm_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Validate alarm status (default Thai)
      tags:
      - alarm
  /alarm/validate/en:
    post:
      consumes:
      - application/json
      description: Same as /validate but uses English messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_alarm_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Validate alarm status (English)
      tags:
      - alarm
  /alarm/validate/th:
    post:
      consumes:
      - application/json
      description: Same as /validate but explicitly uses Thai messages.
      parameters:
      - description: Alarm input data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/helpers.AlarmDetailDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/helpers.AlarmDetailResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_alarm_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Validate alarm status (Thai)
      tags:
      - alarm
  /auth/forgotpassword:
    post:
      consumes:
      - application/json
      description: Forgot password, code will send to email.
      parameters:
      - description: Forgot Password
        in: body
        name: forgotPassword
        required: true
        schema:
          $ref: '#/definitions/presenter.ForgotPassword'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Forgot password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using username and password. Returns access
        and refresh tokens.
      parameters:
      - description: User credentials (username + password)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.SignIn'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens returned successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request / validation error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized (wrong username/password)
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User login with username and password
      tags:
      - auth
  /auth/logout:
    get:
      consumes:
      - application/json
      description: Logout, remove current refresh token in db.
      parameters:
      - description: Authentication header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/logoutall:
    get:
      consumes:
      - application/json
      description: Logout all session of this user.
      parameters:
      - description: Authentication header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout all session
      tags:
      - auth
  /auth/publickey:
    get:
      consumes:
      - application/json
      description: Get rsa public key to decode token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presenter.PublicKey'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get public key
      tags:
      - auth
  /auth/refresh:
    get:
      consumes:
      - application/json
      description: Get new access token from refresh token.
      parameters:
      - description: Authentication header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presenter.Token'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh token
      tags:
      - auth
  /auth/resetpassword:
    patch:
      consumes:
      - application/json
      description: Reset Password, using code from email.
      parameters:
      - description: code
        format: code
        in: query
        name: code
        required: true
        type: string
      - description: Reset Password
        in: body
        name: resetPassword
        required: true
        schema:
          $ref: '#/definitions/presenter.ResetPassword'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Reset Password
      tags:
      - auth
  /auth/signin:
    post:
      consumes:
      - application/json
      description: Authenticates a user using email and password. Returns access and
        refresh tokens.
      parameters:
      - description: User credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.UserSignIn'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens returned successfully
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request / validation error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Unauthorized (wrong email/password)
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: User login with email and password
      tags:
      - auth
  /auth/verifyemail:
    get:
      consumes:
      - application/json
      description: Verify user using code from email.
      parameters:
      - description: offset
        format: code
        in: query
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Verify user
      tags:
      - auth
  /influx/devicechart:
    post:
      consumes:
      - application/json
      description: Retrieves filtered data points from InfluxDB
      parameters:
      - description: Filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.Querydevicechart'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/presenter.DataPointResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_influxdb_delivery_http.errResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_influxdb_delivery_http.errResponse'
      security:
      - BearerAuth: []
      summary: Query raw time-series data
      tags:
      - influxdb
  /influx/filters:
    post:
      consumes:
      - application/json
      description: Retrieves filtered data points from InfluxDB
      parameters:
      - description: Filter parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/presenter.QueryFilterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/presenter.DataPointResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_influxdb_delivery_http.errResponse'
        "500":
