  presenter.ItemCreate:
    properties:
      description:
        example: item description
        type: string
      title:
        example: item title
        type: string
    required:
    - description
    - title
    type: object
  presenter.ItemResponse:
    properties:
      description:
        type: string
      id:
        type: string
      owner_id:
        type: string
      title:
        type: string
    type: object
  presenter.ItemUpdate:
    properties:
      description:
        example: item description
        type: string
      title:
        example: item title
        type: string
    type: object
  presenter.PaginatedIotData:
    properties:
