  presenter.QueryFilterRequest:
    properties:
      bucket:
        example: AIRCOM1
        type: string
      field:
        example: value
        type: string
      limit:
        example: 10000
        type: integer
      measurement:
        example: temperature
        type: string
      offset:
        example: 1
        type: integer
      start:
        example: -1h
        type: string
      stop:
        example: now()
        type: string
    required:
    - field
    - measurement
    type: object
  presenter.Querydevicechart:
    properties:
      bucket:
        example: AIRCOM1
        type: string
      field:
        example: value
        type: string
      limit:
        example: 10000
        type: integer
      measurement:
        example: temperature
        type: string
      offset:
        example: 1
        type: integer
      start:
        example: -1h
        type: string
      stop:
        example: now()
        type: string
    required:
    - field
    - measurement
    type: object
  presenter.ResetPassword:
    properties:
      confirm_password:
        example: password
        minLength: 8
        type: string
      new_password:
        example: password
        minLength: 8
        type: string
    required:
    - confirm_password
    - new_password
    type: object
  presenter.SenserChartResponse:
    properties:
      cache:
        type: string
      data:
        items:
          type: number
        type: array
      date:
        items:
          type: string
        type: array
    type: object
  presenter.SignIn:
    properties:
      password:
        example: password
        minLength: 8
        type: string
      username:
        example: kongnakornna
        type: string
    required:
    - password
    - username
    type: object
  presenter.StatisticsRequest:
    properties:
      aggregate:
        example: value
        type: string
      bucket:
        example: AIRCOM1
        type: string
      field:
        example: value
        type: string
      measurement:
        example: temperature
        type: string
      percentile:
        example: 95
        type: number
      start:
        example: -15s
        type: string
      stop:
        example: now()
        type: string
      windowPeriod:
        example: 15s
        type: string
    required:
    - aggregate
    - bucket
    - field
    - measurement
    type: object
  presenter.StatisticsResponse:
    properties:
      aggregate:
        type: string
      data:
        items:
          $ref: '#/definitions/presenter.DataPointResponse'
        type: array
      value: {}
    type: object
  presenter.SubscribeRequest:
    properties:
      qos:
        maximum: 2
        minimum: 0
        type: integer
      topic:
        type: string
    required:
    - topic
    type: object
  presenter.SubscribeResponse:
    properties:
      message:
        type: string
      qos:
        type: integer
      subscribed_at:
        type: string
      topic:
        type: string
    type: object
  presenter.SubscriptionsResponse:
    properties:
      count:
        type: integer
      topics:
        items:
          type: string
        type: array
    type: object
  presenter.Token:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  presenter.UnsubscribeRequest:
    properties:
      topic:
        type: string
    required:
    - topic
    type: object
  presenter.UnsubscribeResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
      topic:
        type: string
    type: object
  presenter.UserCreate:
    properties:
      confirm_password:
        example: password
        minLength: 8
        type: string
      email:
        example: kongnakornna@gmail.com
        type: string
      firstname:
        example: Kongnakorn
        type: string
      fullname:
        example: Kongnakorn Jantakun
        type: string
      lastname:
        example: Jantakun
        type: string
      line_id:
        example: kongnakorn_line
        type: string
      location_id:
        example: loc_001
        type: string
      mobile_number:
        example: "0812345678"
        type: string
      password:
        example: password
        minLength: 8
        type: string
      phone_number:
        example: "021234567"
        type: string
      role_id:
        example: 2
        minimum: 1
        type: integer
      username:
        example: kongnakornna
        type: string
    required:
    - confirm_password
    - email
    - password
    - role_id
    type: object
  presenter.UserSignIn:
    properties:
      email:
        example: kongnakornna@gmail.com
        type: string
      password:
        example: password
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  presenter.UserUpdate:
    properties:
      firstname:
        type: string
      fullname:
        type: string
      lastname:
        type: string
      line_id:
        type: string
      location_id:
        type: string
      mobile_number:
        type: string
      phone_number:
        type: string
    type: object
  presenter.UserUpdatePassword:
    properties:
      confirm_password:
        minLength: 8
        type: string
      new_password:
        minLength: 8
        type: string
      old_password:
        minLength: 8
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  presenter.UserUpdateRole:
    properties:
      role_id:
        type: integer
    required:
    - role_id
    type: object
  presenter.WriteDataRequest:
    properties:
      fields:
        additionalProperties: true
        type: object
      measurement:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
    required:
    - fields
    - measurement
    type: object
  responses.ErrorResponse:
    properties:
