  /iot/topic:
    get:
      consumes:
      - application/json
      description: |-
        Subscribes to the given topic, waits for a single message, then unsubscribes. Caches the result for 60 seconds.
        Use &delcache=1 to force deletion of the cached value and fetch a fresh payload.
      parameters:
      - description: MQTT topic name (e.g. BAACTW05/DATA)
        in: query
        name: topic
        required: true
        type: string
      - description: Delete cache (1 to delete)
        enum:
        - "1"
        in: query
        name: delcache
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.SwaggerSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Get live or cached MQTT topic data
      tags:
      - iot
  /iot/topicdevicechart:
    get:
      consumes:
      - application/json
      description: |-
        Returns time‑series data from InfluxDB for the given topic/bucket,
        plus the most recent MQTT message received on that topic.
        Uses Redis cache for both parts (45s for chart, 10s for live payload).
        Use &delcache=1 to force deletion of all caches and fetch fresh data.
      parameters:
      - default: AIRCOM1
        description: InfluxDB bucket name (e.g. AIRCOM1 default from topic)
        in: query
        name: bucket
        type: string
      - default: AIRCOM1/DATA
        description: MQTT topic (e.g. AIRCOM1/DATA)
        in: query
        name: topic
        required: true
        type: string
      - default: temperature
        description: Measurement name (default 'temperature')
        in: query
        name: measurement
        type: string
      - default: value
        description: Field name (default 'value')
        in: query
        name: field
        type: string
      - default: -10m
        description: Start time (e.g. -10m, -1h, 2023-01-01T00:00:00Z)
        in: query
        name: start
        type: string
      - description: Stop time (default now())
        in: query
        name: stop
        type: string
      - default: 100
        description: Limit (default 100)
        in: query
        name: limit
        type: integer
      - description: Delete all caches (1 to delete)
        enum:
        - "1"
        in: query
        name: delcache
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/responses.SwaggerSuccessResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
