  /mqtt/devicecontrol:
    get:
      consumes:
      - application/json
      description: Publishes a control message to a topic (usually ending with CONTROL),
        then listens on the corresponding DATA topic (CONTROL replaced by DATA) for
        a response.
      parameters:
      - description: MQTT topic to send control message (e.g., BAACTW02/CONTROL)
        in: query
        name: topic
        required: true
        type: string
      - description: Control message (e.g., ON, OFF, 1, 0)
        in: query
        name: message
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/presenter.DeviceControlResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_delivery_http.errResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_delivery_http.errResponse'
      security:
      - OAuth2Password: []
      summary: Send control command to an MQTT device and wait for response
      tags:
      - mqtt
  /mqtt/gettopicdata:
    get:
      consumes:
      - application/json
      description: Subscribes to the given topic, waits for a single message, then
        unsubscribes. Caches the result for 60 seconds.
      parameters:
      - description: MQTT topic name (e.g. BAACTW05/DATA)
        in: query
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_presenter.MQTTTopicDataResponse'
        "400":
          description: missing topic parameter
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_delivery_http.errResponse'
        "500":
          description: MQTT timeout or internal error
          schema:
            $ref: '#/definitions/icmongolang_internal_modules_mqtt_delivery_http.errResponse'
